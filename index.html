<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>May &amp; Jerrold</title>
  <meta name="description" content="Our pre-wedding photobook">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="May &amp; Jerrold">
  <meta property="og:description" content="Our pre-wedding photobook">
  <meta name="theme-color" content="#FAF6EF">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23FAF6EF'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%232E2B27'%3EM%26amp;J%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-theme="light">
  <header class="cover">
    <div class="cover__frame" aria-hidden="true"></div>
    <div class="cover__content">
      <h1 class="cover__names">May <span class="cover__amp">&amp;</span> Jerrold</h1>
      <span class="cover__divider" aria-hidden="true"></span>
      <p class="cover__tagline">Pre-wedding photobook</p>
    </div>
    <a class="cover__cue" href="#photos">View photos <span class="cover__cue-arrow" aria-hidden="true"></span></a>
  </header>

  <main id="photos" class="photos" tabindex="-1" aria-label="Photos">
    <nav id="locations" class="locations" aria-labelledby="locations-title" hidden>
      <h2 id="locations-title" class="locations__title">Choose a location</h2>
      <span class="locations__divider" aria-hidden="true"></span>
      <ul class="locations__list"></ul>
    </nav>
    <nav id="shoot-nav" class="shoot-nav" aria-label="Shoots" hidden></nav>
    <section id="gallery" class="gallery" aria-label="Gallery"></section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__names">May &amp; Jerrold</p>
  </footer>
</body>
</html>
